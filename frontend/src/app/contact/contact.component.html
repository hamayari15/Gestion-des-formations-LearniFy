<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<div class="container my-5">
    <h1 class="text-center mb-4">{{ 'CONTACT.TITLE' | translate }}</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="map-container" id="map"></div>
        </div>

        <div class="col-md-6">
            <form>

                <div class="mb-3">
                    <label for="name" class="form-label">{{ 'CONTACT.NAME' | translate }}</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        [placeholder]="'CONTACT.NAME_PLACEHOLDER' | translate"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">{{ 'CONTACT.EMAIL' | translate }}</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        [placeholder]="'CONTACT.EMAIL_PLACEHOLDER' | translate"
                        required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">{{ 'CONTACT.MESSAGE' | translate }}</label>
                    <textarea
                        class="form-control"
                        id="message"
                        rows="5"
                        [placeholder]="'CONTACT.MESSAGE_PLACEHOLDER' | translate"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    {{ 'CONTACT.SUBMIT' | translate }}
                </button>

            </form>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
      var map = L.map('map').setView([40.730610, -73.935242], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      L.marker([40.730610, -73.935242]).addTo(map)
        .bindPopup('Your location')
        .openPopup();
    });
</script>
