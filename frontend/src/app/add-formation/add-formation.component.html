<div class="form-container">
  <h1>Cycle de Formation</h1>

  <div class="form-section">
    <label>Entreprise:</label>
    <span>Centre National de l'Informatique</span>
  </div>

  <form [formGroup]="formationForm" (ngSubmit)="addFormation()">
  
    <div class="checkbox-container">
      <div class="checkbox-section">
        <input
          type="checkbox"
          id="credit-impot"
          formControlName="creditImpot"
        />
        <label for="credit-impot">Crédit d'impôt</label>
      </div>
      <div class="checkbox-section">
        <input
          type="checkbox"
          id="droit-individuel"
          formControlName="droitIndividuel"
        />
        <label for="droit-individuel">Droits de tirage (individuel)</label>
      </div>
      <div class="checkbox-section">
        <input
          type="checkbox"
          id="droit-collectif"
          formControlName="droitCollectif"
        />
        <label for="droit-collectif">Droits de tirage (collectif)</label>
      </div>
    </div>

    <div class="form-section">
      <label for="theme">Thème de Formation:</label>
      <input type="text" id="theme" formControlName="theme" />
    </div>

    <div class="form-section">
      <label for="mode-formation">Mode de formation:</label>
      <select id="mode-formation" formControlName="modeFormation" class="mode">
        <option value="" disabled>Choisir le mode</option>
        <option value="En ligne">En ligne</option>
        <option value="Présentiel">Présentiel</option>
      </select>
    </div>

    <div class="form-section" *ngIf="formationForm.get('modeFormation')?.value === 'Présentiel'">
      <label for="num-salle">N° Salle:</label>
      <input type="number" id="num-salle" formControlName="numSalle" />
    </div>

    <div class="periode">
      <label>Période:</label>
      <div class="div">
        <span>Du: </span>
        <input type="date" formControlName="periodeDu" />
        <span>A: </span>
        <input type="date" formControlName="periodeA" />
      </div>
    </div>

    <div class="horaire">
      <label>Horaire:</label>
      <div class="div">
        <span>Du: </span>
        <input type="time" formControlName="horaireDu" />
        <span>A: </span>
        <input type="time" formControlName="horaireA" />
      </div>
    </div>
    
    <button class="btn" type="submit">Ajouter la Formation</button>

  </form>
</div>
