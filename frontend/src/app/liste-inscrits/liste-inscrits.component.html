
<h2>Liste des inscrits</h2>

<div class="d-flex align-items-center">
  <i class="fas fa-search me-2"></i>
  <input
    type="text"
    id="searchTheme"
    [(ngModel)]="searchTheme"
    class="form-control"
    placeholder="Exemple : Angular"
    (input)="search()"/>
</div>


<table class="table table-hover">
  <thead>
    <tr>
      <th>Thème</th>
      <th>N° Salle</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Entreprise</th>
      <th>Validation</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let inscription of filteredInscriptions">
      <td>{{ inscription.theme }}</td>
      <td>{{ inscription.numSalle==="0" ? '_' : inscription.numSalle }}</td>
      <td>{{ inscription.fullname }}</td>
      <td>{{ inscription.email }}</td>
      <td>{{ inscription.entreprise }}</td>

      <td>
        <button
          *ngIf="inscription.status !== 'Validée'"
          (click)="updateStatus(inscription, 'Validée')"
          class="btn btn-success">
          <i class="fas fa-check-circle"></i> Accepter
        </button>
        <button
          *ngIf="inscription.status !== 'Refusée'"
          (click)="updateStatus(inscription, 'Refusée')"
          class="btn btn-danger ms-2">
          <i class="fas fa-times-circle"></i> Refuser
        </button>
      </td>
      
    </tr>
  </tbody>
</table>

<div *ngIf="filteredInscriptions.length === 0" class="alert alert-info">
  Aucun inscrit trouvé pour le moment.
</div>
