<div class="container">
  <div class="form-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <h2 class="icon">Login</h2>
      
      <div class="form-group">
        <div class="email-container">
        <label for="email">Email:</label>
        <span class="email-icon"><i class="fa-solid fa-user"></i> </span>
        <input
          type="email"
          id="email"
          formControlName="Email"
          placeholder="Enter your email"
          (input)="onInputChange()"/>
      </div>

        <div *ngIf="email?.touched && email?.invalid" class="alert alert-danger">
          <div *ngIf="email?.errors?.['required']">Email is required.</div>
          <div *ngIf="email?.errors?.['minlength']">Email must be 8 caracters.</div>
          <div *ngIf="email?.errors?.['Email']">Invalid email format.</div>
        </div>
      </div>

      <div class="form-group">
        <div class="password-container">
          <label for="password">Password:</label>
          <span class="password-icon"><i class="fa-solid fa-lock"></i></span>
          <input
            [type]="isPasswordVisible ? 'text' : 'Password'"
            id="password"
            formControlName="Password"
            placeholder="Enter your password"
            (input)="onInputChange()"/>

          <i class="fa"
            [ngClass]="isPasswordVisible ? 'fa-eye-slash' : 'fa-eye'"
            (click)="togglePasswordVisibility()"></i>
        </div>
        
        <div *ngIf="password?.touched && password?.invalid" class="alert alert-danger">
          <div *ngIf="password?.errors?.['required']">Password is required.</div>
          <div *ngIf="password?.errors?.['minlength']">
            Password must be at least 6 characters.
          </div>
        </div>
      </div>
      
      <div>
        <label>Profile</label>
        <select class="profile" formControlName="Profile">
          <option class="dis" value="User" disabled>Select profile</option>
          <option value="Admin">Admin</option>
          <option value="Participant">Participant</option>
        </select>
      </div>
    
      <button type="submit" class="btn" [disabled]="loginForm.invalid">Login</button>

      <p *ngIf="Error" class="error-message">{{ Error }}</p>

      <p class="switch-form">
        You don't have an account? <a routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
