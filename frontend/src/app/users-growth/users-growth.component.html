<div class="dashboard-container">

  <div class="dashboard-header">
    <h1>Statistiques des participants</h1>
    <p class="dashboard-subtitle">Analyse démographique et évolution des inscriptions</p>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <span>Chargement des données...</span>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <i class="fas fa-triangle-exclamation"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="stats-grid" *ngIf="!isLoading">

    <div class="chart-container chart-growth">
      <div class="chart-header">
        <i class="fas fa-chart-area"></i>
        <span>Croissance des participants</span>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="growthChart"></canvas>
      </div>
    </div>

    <div class="chart-container chart-age">
      <div class="chart-header">
        <i class="fas fa-users-viewfinder"></i>
        <span>Répartition par âge</span>
      </div>
      <div class="chart-canvas-wrap">
        <canvas
          baseChart
          [data]="ageChartData"
          [options]="chartOptions"
          [type]="chartType">
        </canvas>
      </div>
    </div>

    <div class="chart-container chart-gender">
      <div class="chart-header">
        <i class="fas fa-venus-mars"></i>
        <span>Répartition par genre</span>
      </div>
      <div class="chart-canvas-wrap">
        <canvas
          baseChart
          [data]="genderChartData"
          [options]="chartOptions"
          [type]="chartType">
        </canvas>
      </div>
    </div>

    <div class="chart-container chart-line">
      <div class="chart-header">
        <i class="fas fa-chart-line"></i>
        <span>Évolution dans le temps</span>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="growthLineChart"></canvas>
      </div>
    </div>

    <div class="chart-container chart-doughnut">
      <div class="chart-header">
        <i class="fas fa-circle-notch"></i>
        <span>Distribution globale</span>
      </div>
      <div class="chart-canvas-wrap doughnut-wrap">
        <canvas
          baseChart
          [data]="doughnutChartData"
          [type]="doughnutChartType">
        </canvas>
      </div>
    </div>

  </div>

</div>
